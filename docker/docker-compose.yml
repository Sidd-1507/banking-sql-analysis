version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: banking-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: banking123
      MYSQL_DATABASE: banking_db
    ports:
      - "3306:3306"
    volumes:
      # Auto-initialize: MySQL runs .sql files in /docker-entrypoint-initdb.d/ alphabetically
      - ../schema/01_create_database.sql:/docker-entrypoint-initdb.d/01_create_database.sql
      - ../schema/02_create_tables.sql:/docker-entrypoint-initdb.d/02_create_tables.sql
      - ../schema/03_create_indexes.sql:/docker-entrypoint-initdb.d/03_create_indexes.sql
      - ../data/01_insert_branches.sql:/docker-entrypoint-initdb.d/04_insert_branches.sql
      - ../data/02_insert_customers.sql:/docker-entrypoint-initdb.d/05_insert_customers.sql
      - ../data/03_insert_accounts.sql:/docker-entrypoint-initdb.d/06_insert_accounts.sql
      - ../data/04_insert_transactions.sql:/docker-entrypoint-initdb.d/07_insert_transactions.sql
      - ../data/05_insert_loans.sql:/docker-entrypoint-initdb.d/08_insert_loans.sql
      - ../data/06_insert_cards.sql:/docker-entrypoint-initdb.d/09_insert_cards.sql
      - ../views/01_create_views.sql:/docker-entrypoint-initdb.d/10_create_views.sql
      - ../procedures/01_stored_procedures.sql:/docker-entrypoint-initdb.d/11_stored_procedures.sql
      # Persist data across restarts
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --sql-mode=PIPES_AS_CONCAT,STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    driver: local
